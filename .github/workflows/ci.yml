# .github/workflows/ci.yml

name: Terraform CI Checks

# Runs on every Pull Request to ensure code quality before merging
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform_validate:
    name: Validate and Format Check
    runs-on: ubuntu-latest
    
    // Use the AWS CLI profile 'demo' for validation (optional, but good practice)
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1 // You can change this to your desired region

    steps:
      // Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      // Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_hostname: ${{ env.AWS_REGION }}

      // Initialize the Terraform working directory
      - name: Terraform Init
        id: init
        run: terraform init

      // Check if the code is correctly formatted
      - name: Terraform Format Check (fmt)
        id: fmt
        run: terraform fmt -check -recursive
        
      // Validate the syntax and configuration
      - name: Terraform Validation (validate)
        id: validate
        run: terraform validate